[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pm"
version = "0.1.0"
description = "Delivery Steward — project management agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "anthropic>=0.40",
    "apscheduler>=3.11,<4",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-python-dateutil",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_pm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "RUF"]
ignore = [
    "B008",            # FastAPI Depends() in argument defaults is idiomatic
    "RUF001", "RUF002", # en/em dashes in prose and docstrings are deliberate
    "UP046", "UP047",  # explicit Generic[...] is better behaved with
                       # pydantic generic models and SQLAlchemy's typing than
                       # PEP 695 syntax is today
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
# Signatures below are imposed by an external contract, so an unused argument
# is a requirement rather than an oversight:
#   integrations/* — fixture implementations must match their Protocol
#   error_handlers, main, middleware — FastAPI decides the signature
#   db/types.py — SQLAlchemy's TypeDecorator interface
"src/agent_pm/integrations/*" = ["ARG002"]
"src/agent_pm/api/error_handlers.py" = ["ARG001"]
"src/agent_pm/main.py" = ["ARG001"]
"src/agent_pm/db/types.py" = ["ARG002"]

[tool.mypy]
python_version = "3.12"
packages = ["agent_pm"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
