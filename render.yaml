# Render blueprint.
#
# Defaults to the FREE tier so this deploys without a payment method.
#
# Two consequences you should know about before relying on it:
#
#   1. A free web service SPINS DOWN after ~15 minutes of inactivity and takes
#      ~50s to wake. The scheduler runs inside this process, so the 08:00 and
#      17:30 standups only fire if the service happens to be awake. Scheduled
#      posting is effectively unreliable on the free tier.
#
#   2. Render has no free tier for background workers, which is why the
#      scheduler is not a separate service here. Running it in-process is only
#      safe while there is exactly one instance — two instances would post
#      every standup twice.
#
# To make the cadence dependable, upgrade the web service to `starter` and
# uncomment the worker below, then set SCHEDULER_ENABLED=false on the web
# service so only the worker schedules.

services:
  - type: web
    name: agent-pm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn agent_pm.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: prod
      - key: DEBUG
        value: false
      - key: LOG_FORMAT
        value: json
      # True only because there is no separate worker on the free tier.
      # Set to false if you add the worker below.
      - key: SCHEDULER_ENABLED
        value: true
      # Supabase session pooler, asyncpg scheme:
      #   postgresql+asyncpg://postgres.<ref>:<pw>@<host>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # JSON array, e.g. ["https://agent-pm.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
      # Optional. Omit any of these and that integration runs on fixtures.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MEETING_AGENT_WEBHOOK_SECRET
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: TEAMS_WEBHOOK_URL
        sync: false

