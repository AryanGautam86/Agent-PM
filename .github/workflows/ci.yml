name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy

      - name: Unit and API tests
        run: pytest -m "not integration"

      - name: Agent eval gate
        # Runs on the fixture model, so this checks wiring, schemas and
        # grounding plumbing rather than model quality. Promoting a task to a
        # higher autonomy level should additionally be gated on a run with a
        # real ANTHROPIC_API_KEY.
        run: python -m agent_pm.evals.runner

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_pm
          POSTGRES_PASSWORD: agent_pm
          POSTGRES_DB: agent_pm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_pm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://agent_pm:agent_pm@localhost:5432/agent_pm
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://agent_pm:agent_pm@localhost:5432/agent_pm
      # Separate on purpose: the migration tests drop every table, so they
      # only run against a database explicitly nominated as disposable.
      ALEMBIC_TEST_DATABASE_URL: postgresql+asyncpg://agent_pm:agent_pm@localhost:5432/agent_pm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Schema matches the models, and rolls back cleanly
        run: pytest -m integration

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Placeholder values: the build must not require real credentials.
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
        run: npm run build
